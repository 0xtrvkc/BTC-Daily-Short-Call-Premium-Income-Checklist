name: Fetch M7 Delta Selection

on:
  schedule:
    # Runs at 23:30 UTC daily = 06:30 TH — ready before your 07:00 entry window
    - cron: '30 23 * * *'
  workflow_dispatch:  # manual trigger button in GitHub Actions tab

jobs:
  fetch-m7:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python scripts/fetch_m7.py

      - name: Commit data/m7.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/m7.json
          git diff --staged --quiet || git commit -m "chore: update m7.json [skip ci]"
          git push
