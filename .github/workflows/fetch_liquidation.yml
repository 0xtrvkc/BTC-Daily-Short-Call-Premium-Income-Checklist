name: Fetch BTC Liquidation 24h

on:
  schedule:
    # Runs at 23:30 UTC = 06:30 Bangkok — data ready before your 07:00 TH check window
    - cron: "30 23 * * *"
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-liquidation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: python scripts/fetch_liquidation.py

      - name: Commit and push data/liquidation.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/liquidation.json
          git diff --cached --quiet || git commit -m "chore: update liquidation data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
